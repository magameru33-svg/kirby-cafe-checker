name: Kirby Cafe Availability Check

on:
  schedule:
    # JST = UTC+9 なので UTC で指定
    - cron: '15 9 * * *'   # JST 18:15
    - cron: '30 9 * * *'   # JST 18:30
    - cron: '0 1 * * *'    # JST 10:00 (毎日の通常チェック)
  workflow_dispatch:        # 手動実行も可能

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright pillow jpholiday
          playwright install chromium
          playwright install-deps chromium

      - name: Run checker
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python check_kirby_cafe.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kirby-results-${{ github.run_id }}
          path: |
            *.txt
            *.png
          retention-days: 7
